<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#07090E"/>
  <circle cx="256" cy="256" r="210" fill="url(#bgGlow)" opacity="0.15"/>
  <polygon points="190,140 380,256 190,372" fill="url(#playGrad)" filter="url(#dropGlow)"/>
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playGrad" x1="190" y1="140" x2="380" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E3D"/>
      <stop offset="100%" stop-color="#B8000B"/>
    </linearGradient>
    <filter id="dropGlow" x="160" y="110" width="250" height="292" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>
