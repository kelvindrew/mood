<!doctype html>
<html lang="fr" class="dark bg-background text-white select-none">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E50914'><polygon points='5 3 19 12 5 21 5 3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07090E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MOOD — Plateforme Jeux Smart TV & Manettes Mobiles</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    </noscript>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #07090E;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .mood-preloader-brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .mood-preloader-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(25px);
        animation: moodPulse 2.5s ease-in-out infinite;
      }
      .mood-preloader-title {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #ffffff;
        text-shadow: 0 0 25px rgba(255,255,255,0.3);
        z-index: 1;
      }
      .mood-preloader-badge {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.18);
        color: #ffffff;
        padding: 3px 8px;
        border-radius: 6px;
        z-index: 1;
      }
      .mood-spinner-box {
        position: relative;
        width: 48px;
        height: 48px;
        margin-bottom: 18px;
      }
      .mood-spinner-track {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.08);
      }
      .mood-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #ffffff;
        border-right-color: #cbd5e1;
        animation: moodSpin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      }
      .mood-preloader-text {
        font-size: 13px;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 1px;
        text-transform: uppercase;
        animation: moodTextPulse 1.8s ease-in-out infinite;
      }
      @keyframes moodSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes moodPulse {
        0%, 100% { transform: scale(0.9); opacity: 0.5; }
        50% { transform: scale(1.2); opacity: 0.8; }
      }
      @keyframes moodTextPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; color: #ffffff; }
      }
    </style>
  </head>
  <body class="bg-[#07090E] text-white antialiased overflow-x-hidden font-sans min-h-screen">
    <!-- Préchargeur visuel instantané pour supprimer tout écran noir -->
    <div id="app-preloader" role="status" aria-label="Chargement de l'application">
      <div class="mood-preloader-brand">
        <div class="mood-preloader-glow"></div>
        <span class="mood-preloader-title">MOOD</span>
        <span class="mood-preloader-badge">TV</span>
      </div>
      <div class="mood-spinner-box">
        <div class="mood-spinner-track"></div>
        <div class="mood-spinner-ring"></div>
      </div>
      <div class="mood-preloader-text">Chargement du salon…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
